<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#030708"/>
      <stop offset="0.55" stop-color="#06120f"/>
      <stop offset="1" stop-color="#020506"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="46%" r="50%">
      <stop offset="0" stop-color="#39ff14" stop-opacity="0.16"/>
      <stop offset="0.5" stop-color="#0b6b57" stop-opacity="0.08"/>
      <stop offset="1" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="cyanGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#22d3ee" stop-opacity="0.12"/>
      <stop offset="1" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="neon" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#39ff14"/>
      <stop offset="1" stop-color="#22d3ee"/>
    </linearGradient>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M48 0H0V48" fill="none" stroke="#0d2b28" stroke-width="1"/>
    </pattern>
    <pattern id="hex" width="120" height="104" patternUnits="userSpaceOnUse">
      <path d="M30 2 L90 2 L118 52 L90 102 L30 102 L2 52 Z" fill="none" stroke="#123f38" stroke-width="1.2"/>
    </pattern>
    <pattern id="scan" width="4" height="4" patternUnits="userSpaceOnUse">
      <rect width="4" height="1" fill="#39ff14" opacity="0.04"/>
    </pattern>
  </defs>

  <rect width="1920" height="1080" fill="url(#bg)"/>
  <rect width="1920" height="1080" fill="url(#hex)" opacity="0.4"/>
  <rect width="1920" height="1080" fill="url(#grid)" opacity="0.35"/>
  <circle cx="960" cy="470" r="700" fill="url(#glow)"/>
  <circle cx="1620" cy="940" r="420" fill="url(#cyanGlow)"/>
  <circle cx="300" cy="120" r="360" fill="url(#cyanGlow)"/>

  <g stroke="#145c4a" stroke-width="2" fill="none" opacity="0.55">
    <path d="M0 980 H240 L320 900 H560"/>
    <path d="M0 1014 H200 L280 934 H520"/>
    <path d="M1360 80 H1580 L1660 0 H1920"/>
  </g>
  <g fill="#39ff14" opacity="0.7">
    <circle cx="240" cy="980" r="4"/><circle cx="560" cy="900" r="4"/>
    <circle cx="200" cy="1014" r="3"/><circle cx="520" cy="934" r="3"/>
    <circle cx="1580" cy="80" r="4"/><circle cx="1660" cy="0" r="3"/>
  </g>

  <rect width="1920" height="1080" fill="url(#scan)"/>
  <rect x="40" y="40" width="1840" height="1000" rx="10" fill="none"
        stroke="#123f38" stroke-width="1.5" opacity="0.45"/>
  <rect x="70" y="70" width="220" height="3" fill="url(#neon)" opacity="0.6"/>
  <rect x="1630" y="1007" width="220" height="3" fill="url(#neon)" opacity="0.6"/>
