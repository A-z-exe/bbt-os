<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#030708"/>
      <stop offset="0.55" stop-color="#061312"/>
      <stop offset="1" stop-color="#020506"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#39ff14" stop-opacity="0.22"/>
      <stop offset="0.55" stop-color="#0b6b57" stop-opacity="0.10"/>
      <stop offset="1" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="cyanGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#22d3ee" stop-opacity="0.20"/>
      <stop offset="1" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="neon" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#39ff14"/>
      <stop offset="1" stop-color="#22d3ee"/>
    </linearGradient>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M48 0H0V48" fill="none" stroke="#0d2b28" stroke-width="1"/>
    </pattern>
    <pattern id="scan" width="4" height="4" patternUnits="userSpaceOnUse">
      <rect width="4" height="1" fill="#39ff14" opacity="0.05"/>
    </pattern>
    <pattern id="hex" width="120" height="104" patternUnits="userSpaceOnUse">
      <path d="M30 2 L90 2 L118 52 L90 102 L30 102 L2 52 Z" fill="none" stroke="#123f38" stroke-width="1.2"/>
    </pattern>
  </defs>

  <rect width="1920" height="1080" fill="url(#bg)"/>
  <rect width="1920" height="1080" fill="url(#hex)" opacity="0.55"/>
  <rect width="1920" height="1080" fill="url(#grid)" opacity="0.5"/>
  <circle cx="330" cy="240" r="620" fill="url(#glow)"/>
  <circle cx="1550" cy="760" r="560" fill="url(#cyanGlow)"/>

