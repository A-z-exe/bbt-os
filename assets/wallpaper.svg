    <rect x="0" y="0" width="560" height="42" rx="18" fill="#0a1c19"/>
    <circle cx="28" cy="21" r="7" fill="#ff5f56"/>
    <circle cx="52" cy="21" r="7" fill="#ffbd2e"/>
    <circle cx="76" cy="21" r="7" fill="#27c93f"/>
    <text x="104" y="27" font-family="DejaVu Sans Mono, monospace" font-size="16" fill="#6fbfa8">bbt@os: ~</text>
    <text x="30" y="92" font-family="DejaVu Sans Mono, monospace" font-size="20" fill="#39ff14">$ bbt -t https://target -m auto</text>
    <text x="30" y="132" font-family="DejaVu Sans Mono, monospace" font-size="20" fill="#22d3ee">$ katana -u https://target -jc</text>
    <text x="30" y="172" font-family="DejaVu Sans Mono, monospace" font-size="20" fill="#d7fff1">$ nuclei -l subs.txt -severity high</text>
    <text x="30" y="212" font-family="DejaVu Sans Mono, monospace" font-size="20" fill="#d7fff1">$ adb devices -l</text>
    <text x="30" y="252" font-family="DejaVu Sans Mono, monospace" font-size="20" fill="#d7fff1">$ netexec smb 10.0.0.0/24</text>
    <text x="30" y="292" font-family="DejaVu Sans Mono, monospace" font-size="20" fill="#ffbd2e">[scope] authorized targets only</text>
    <text x="30" y="350" font-family="DejaVu Sans Mono, monospace" font-size="22" fill="#39ff14">_</text>
  </g>

